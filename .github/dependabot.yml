import { NextApiRequest, NextApiResponse } from 'next';
import { BlobServiceClient } from '@azure/storage-blob';
import { deleteReportFromAtlas } from '../lib/atlas';

interface GapReportCleanupProps {
  reportRequestId: string;
}

export default async function handler(
  req: NextApiRequest,
  res: NextApiResponse
) {
  if (req.method !== 'POST') {
    return res.status(405).json({ message: 'Method not allowed' });
  }

  const { reportRequestId } = req.body as GapReportCleanupProps;

  try {
    // Validate input
    if (!reportRequestId || typeof reportRequestId !== 'string') {
      throw new Error('Invalid reportRequestId');
    }

    // Delete the Blob and Neon row
    await deleteBlob(reportRequestId);
    await deleteNeonRow(reportRequestId);

    // Call the ATLAS-side delete for each expired reportRequestId
    await deleteReportFromAtlas(reportRequestId);

    res.status(200).json({ message: 'Cleanup successful' });
  } catch (error) {
    console.error('Error during cleanup:', error);
    res.status(500).json({ message: 'Internal server error' });
  }
}

async function deleteBlob(reportRequestId: string): Promise<void> {
  const blobServiceClient = BlobServiceClient.fromConnectionString(process.env.BLOB_STORAGE_CONNECTION_STRING!);
  const containerClient = blobServiceClient.getContainerClient('gap-reports');
  const blobClient = containerClient.getBlockBlobClient(`${reportRequestId}.csv`);

  if (await blobClient.exists()) {
    await blobClient.delete();
  }
}

