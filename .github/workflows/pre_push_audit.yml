name: Pre-push Audit

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  pre-push-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Resolve origin HEAD
        run: git remote set-head origin --auto || git remote set-head origin main

      - name: Plan-doc audit bundle
        run: bash scripts/pre_push_audit.sh

      - name: Install web deps
        run: npm --prefix web ci

      - name: ESLint (web)
        run: npm --prefix web run lint

      - name: Deflection checkout tests
        run: npm --prefix web run test:deflection-checkout

      - name: Deflection checkout env tests
        run: npm --prefix web run test:deflection-checkout-env

      - name: Deflection browser upload smoke tests
        run: npm --prefix web run test:deflection-browser-upload-smoke

      - name: Deflection CSV privacy contract
        run: npm --prefix web run test:deflection-csv-privacy

      - name: Deflection email results-link tests
        run: npm --prefix web run test:deflection-email-results-link

      - name: Deflection hosted Checkout smoke tests
        run: npm --prefix web run test:deflection-hosted-checkout-smoke

      - name: Deflection hosted results smoke tests
        run: npm --prefix web run test:deflection-hosted-results-smoke

      - name: Deflection intake ATLAS submit tests
        run: npm --prefix web run test:deflection-intake-atlas-submit

      - name: Deflection live submit smoke tests
        run: npm --prefix web run test:deflection-live-submit-smoke

      - name: Deflection paid unlock smoke tests
        run: npm --prefix web run test:deflection-paid-unlock-smoke

      - name: Deflection public reachability smoke tests
        run: npm --prefix web run test:deflection-public-reachability-smoke

      - name: Deflection Snapshot landing smoke tests
        run: npm --prefix web run test:deflection-snapshot-landing-smoke

      - name: Deflection rate-limit tests
        run: npm --prefix web run test:deflection-rate-limit

      - name: Deflection teaser rank-copy tests
        run: npm --prefix web run test:deflection-teaser-rank-copy
