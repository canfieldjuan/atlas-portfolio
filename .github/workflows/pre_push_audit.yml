name: Pre-push Audit

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  pre-push-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Resolve origin HEAD
        run: git remote set-head origin --auto || git remote set-head origin main

      - name: Plan-doc audit bundle
        run: bash scripts/pre_push_audit.sh

      - name: Install web deps
        run: npm --prefix web ci

      - name: Test enrollment audit
        run: node web/scripts/audit-test-enrollment.mjs

      - name: Test enrollment audit tests
        run: npm --prefix web run test:test-enrollment-audit

      - name: Dead code baseline
        run: npm --prefix web run check:dead-code

      - name: Dead code baseline tests
        run: npm --prefix web run test:dead-code-baseline

      - name: ESLint (web)
        run: npm --prefix web run lint

      - name: Advertising helper tests
        run: npm --prefix web run test:ads-helpers

      - name: Google Ads API tests
        run: npm --prefix web run test:google-ads-api

      - name: Google Ads artifact contract tests
        run: npm --prefix web run test:google-ads-artifacts

      - name: Deflection checkout tests
        run: npm --prefix web run test:deflection-checkout

      - name: Deflection checkout env tests
        run: npm --prefix web run test:deflection-checkout-env

      - name: Deflection partner access tests
        run: npm --prefix web run test:deflection-partner-access

      - name: Deflection browser upload smoke tests
        run: npm --prefix web run test:deflection-browser-upload-smoke

      - name: Deflection CSV privacy contract
        run: npm --prefix web run test:deflection-csv-privacy

      - name: Deflection cost projection share tests
        run: npm --prefix web run test:deflection-cost-projection-share

      - name: Deflection email results-link tests
        run: npm --prefix web run test:deflection-email-results-link

      - name: Deflection Snapshot PDF email tests
        run: npm --prefix web run test:deflection-snapshot-pdf-email

      - name: Deflection comeback analytics tests
        run: npm --prefix web run test:deflection-comeback-analytics

      - name: Deflection GA path redaction tests
        run: npm --prefix web run test:deflection-ga-path-redaction

      - name: Deflection hosted Checkout smoke tests
        run: npm --prefix web run test:deflection-hosted-checkout-smoke

      - name: Deflection hosted results smoke tests
        run: npm --prefix web run test:deflection-hosted-results-smoke

      - name: Deflection intake ATLAS submit tests
        run: npm --prefix web run test:deflection-intake-atlas-submit

      - name: Deflection live submit smoke tests
        run: npm --prefix web run test:deflection-live-submit-smoke

      - name: Deflection paid unlock smoke tests
        run: npm --prefix web run test:deflection-paid-unlock-smoke

      - name: Deflection public reachability smoke tests
        run: npm --prefix web run test:deflection-public-reachability-smoke

      - name: Deflection results state tests
        run: npm --prefix web run test:deflection-results-state

      - name: Deflection Snapshot landing smoke tests
        run: npm --prefix web run test:deflection-snapshot-landing-smoke

      - name: Deflection row renderer share tests
        run: npm --prefix web run test:deflection-row-renderer-share

      - name: Deflection rate-limit tests
        run: npm --prefix web run test:deflection-rate-limit

      - name: Deflection teaser rank-copy tests
        run: npm --prefix web run test:deflection-teaser-rank-copy

      - name: Local env loader tests
        run: npm --prefix web run test:local-env
