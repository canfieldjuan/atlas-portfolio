name: Deflection Uploaded Search Monitor

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Public base URL to smoke.
        required: false
        default: https://juancanfield.com
  schedule:
    - cron: "43 13 * * *"

permissions:
  contents: read
  issues: write

jobs:
  uploaded-search-monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check monitor configuration
        id: monitor-config
        shell: bash
        env:
          MONITOR_REQUEST_ID: ${{ secrets.DEFLECTION_UPLOADED_SEARCH_MONITOR_REQUEST_ID }}
          MONITOR_QUERY: ${{ secrets.DEFLECTION_UPLOADED_SEARCH_MONITOR_QUERY }}
        run: |
          artifact="$RUNNER_TEMP/deflection-uploaded-search-smoke.json"
          if [ -z "$MONITOR_REQUEST_ID" ] || [ -z "$MONITOR_QUERY" ]; then
            node -e "require('node:fs').writeFileSync(process.argv[1], JSON.stringify({ ok: true, mode: 'DEFLECTION_UPLOADED_SEARCH_MONITOR', status: 'monitor_not_configured', apiCalls: false, mutations: false }, null, 2) + '\n')" "$artifact"
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Uploaded search monitor secrets are not configured; skipping deployed smoke."
            exit 0
          fi
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Run production uploaded-search smoke
        if: steps.monitor-config.outputs.configured == 'true'
        shell: bash
        env:
          MONITOR_REQUEST_ID: ${{ secrets.DEFLECTION_UPLOADED_SEARCH_MONITOR_REQUEST_ID }}
          MONITOR_QUERY: ${{ secrets.DEFLECTION_UPLOADED_SEARCH_MONITOR_QUERY }}
        run: |
          base_url="${{ github.event.inputs.base_url }}"
          if [ -z "$base_url" ]; then
            base_url="https://juancanfield.com"
          fi

          npm --prefix web run smoke:deflection-uploaded-search -- \
            --base-url "$base_url" \
            --request-id "$MONITOR_REQUEST_ID" \
            --query "$MONITOR_QUERY" \
            --json \
            --output "$RUNNER_TEMP/deflection-uploaded-search-smoke.json"

      - name: Upload smoke artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deflection-uploaded-search-smoke
          path: ${{ runner.temp }}/deflection-uploaded-search-smoke.json
          if-no-files-found: ignore

      - name: Open monitor failure issue
        if: failure() && steps.monitor-config.outputs.configured == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Deflection uploaded search monitor failing';
            const marker = '<!-- deflection-uploaded-search-monitor -->';
            const { owner, repo } = context.repo;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const baseUrl = context.payload.inputs?.base_url || 'https://juancanfield.com';
            const body = [
              marker,
              'The Deflection uploaded search monitor failed.',
              '',
              `- Workflow: ${context.workflow}`,
              `- Run: ${runUrl}`,
              `- Base URL: ${baseUrl}`,
              `- Commit: ${context.sha}`,
              '',
              'Check the `deflection-uploaded-search-smoke` artifact for the sanitized failure payload.',
              'The artifact must contain shape/count metadata only, never request ids, query text, answers, evidence, or source labels.',
            ].join('\n');
            const query = [
              `repo:${owner}/${repo}`,
              'is:issue',
              'is:open',
              `"${title}"`,
            ].join(' ');
            const search = await github.rest.search.issuesAndPullRequests({ q: query, per_page: 10 });
            const existing = search.data.items.find((item) => item.title === title && !item.pull_request);
            if (existing) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner,
                repo,
                title,
                body,
              });
            }
