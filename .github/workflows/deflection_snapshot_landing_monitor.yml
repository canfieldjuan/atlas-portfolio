name: Deflection Snapshot Landing Monitor

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Public base URL to smoke.
        required: false
        default: https://juancanfield.com
  schedule:
    - cron: "17 13 * * *"

permissions:
  contents: read
  issues: write

jobs:
  snapshot-landing-monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run production Snapshot landing smoke
        shell: bash
        run: |
          base_url="${{ github.event.inputs.base_url }}"
          if [ -z "$base_url" ]; then
            base_url="https://juancanfield.com"
          fi

          npm --prefix web run smoke:deflection-snapshot-landing -- \
            --base-url "$base_url" \
            --json \
            --output "$RUNNER_TEMP/deflection-snapshot-landing-smoke.json"

      - name: Upload smoke artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deflection-snapshot-landing-smoke
          path: ${{ runner.temp }}/deflection-snapshot-landing-smoke.json
          if-no-files-found: ignore

      - name: Open monitor failure issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Deflection Snapshot landing monitor failing';
            const marker = '<!-- deflection-snapshot-landing-monitor -->';
            const { owner, repo } = context.repo;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const baseUrl = context.payload.inputs?.base_url || 'https://juancanfield.com';
            const body = [
              marker,
              'The Deflection Snapshot landing monitor failed.',
              '',
              `- Workflow: ${context.workflow}`,
              `- Run: ${runUrl}`,
              `- Base URL: ${baseUrl}`,
              `- Commit: ${context.sha}`,
              '',
              'Check the `deflection-snapshot-landing-smoke` artifact for the failure payload.',
            ].join('\n');
            const query = [
              `repo:${owner}/${repo}`,
              'is:issue',
              'is:open',
              `"${title}"`,
            ].join(' ');
            const search = await github.rest.search.issuesAndPullRequests({ q: query, per_page: 10 });
            const existing = search.data.items.find((item) => item.title === title && !item.pull_request);
            if (existing) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner,
                repo,
                title,
                body,
              });
            }
